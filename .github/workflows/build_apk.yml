name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK de Flutter
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Inicializar estructura de plataforma (si es necesario)
        run: |
          if [ ! -d "android" ]; then
            echo "Generando carpeta android..."
            flutter create . --org com.example --project-name sesion1
          fi

      - name: 📦 Descargar dependencias
        run: flutter pub get

      - name: 🚀 Compilar APK (Release)
        run: flutter build apk --release

      - name: 📤 Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: sesion1-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
